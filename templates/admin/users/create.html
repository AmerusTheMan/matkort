{% extends"layout.html" %}


{% block header %}{{ super() }}<h1>{% block title %} Create User {% endblock %}</h1>{% endblock %}


{% block main %}
<form method="post">
    <h3>Username</h3>
    <input type="text" name="username" required="required" class="input-field">

    <h3>Password</h3>
    <input type="password" name="password" required="required" class="input-field">

    <h3>Confirm password</h3>
    <input type="password" name="password_confirm" required="required" class="input-field">

    <h3>
        Is admin<input type="checkbox" name="is_admin">
    </h3>

    <p><input type="submit" value="Create"></p>
</form>
{% endblock %}
