{% extends "data_list.html" %}

{% block header %}{{ super() }}<h1>{% block title %} Users {% endblock %}</h1>{% endblock %}


{% block main %}
    <a href="{{ url_for("users_create")}}">Add new</a>
    {% for user in users %}
        <div class="data-row">
            <strong>{{ user["username"] }}</strong>
            <a href="{{ url_for("users_update", user_id=user["id"]) }}"">EDIT</a>
            <form action="{{ url_for("users_delete_post", user_id=user["id"]) }}" method="post">
                <input type="submit" value="REMOVE" onclick="return confirm('Are you sure you want to remove this user')">
            </form>
        </div>
    {% endfor %}
{% endblock %}
