{% extends "layout.html" %}

{% block header %}{{ super() }}<h1>{% block title %} Update place {% endblock %}</h1>{% endblock %}


{% block main %}
<form method="post">
    <h2>Place id: {{ place["id"] }}</h2>
    <h3>Name</h3>
    <input type="text" name="name" value="{{ place['name'] }}" class="input-field">
    
    <h3>Address</h3>
    <input type="text" name="address" value="{{ place['address'] }}" class="input-field" autocomplete="off">

    <h3>Maps-link</h3>
    <input type="url" name="maps" value="{{ place['maps'] }}" class="input-field" >
    
    <h3>Tags</h3>
    <input type="text" name="tags" value="{{ place['tags'] }}" class="input-field">
    
    <h3>Traveltime (min)</h3>
    <input type="number" name="travel_time_min" value="{{ place['travel_time_min'] }}" class="input-field">
    
    <h3>Extra info</h3>
    <textarea rows="5" name="extra_info">{{ place['extra_info'] }}</textarea>

    <p><input type="submit" value="Update"></p>
</form>

{% endblock %}
